spring.application.name=cooperativaBackend


# =========================================================
# POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cooperativa_db}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# INICIALIZACIÓN SQL
# =========================================================

spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# =========================================================
# SERVIDOR
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0


# =========================================================
# CARGA DE DOCUMENTOS
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
DOCUMENTS_DIR=${DOCUMENTS_STORAGE_PATH:uploads/documentos}


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

jwt.expiration=3600000


# =========================================================
# CORREO - GMAIL API
# =========================================================

# Configurar GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET,
# GMAIL_REFRESH_TOKEN y GMAIL_FROM_EMAIL en el entorno.
